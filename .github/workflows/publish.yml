name: Test Package

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test Python
        run: python --version

      - name: Build Package
        run: |
          python -m pip install --upgrade build
          python -m build
